<mat-sidenav-container class="min-h-screen bg-slate-50 dark:bg-slate-950">
  <mat-sidenav #drawer mode="over" class="w-64">
    <div class="p-4 font-display font-bold text-indigo-600">LearnFlow</div>
    <mat-nav-list>
      @for (item of nav; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="bg-indigo-50 dark:bg-slate-900">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar class="sticky top-0 z-40 border-b border-slate-200/70 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur">
      <button mat-icon-button class="md:hidden" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="font-display font-semibold">LearnFlow</span>
      <span class="flex-1"></span>
      <button mat-icon-button (click)="theme.toggle()">
        <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-button (click)="auth.logout()">Logout</button>
    </mat-toolbar>
    <div class="hidden md:flex border-b border-slate-200/70 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 backdrop-blur px-4 gap-1">
      @for (item of nav; track item.path) {
        <a
          mat-button
          [routerLink]="item.path"
          routerLinkActive="mat-primary"
        >
          <mat-icon class="!text-base mr-1">{{ item.icon }}</mat-icon>
          {{ item.label }}
        </a>
      }
    </div>
    <main class="max-w-7xl mx-auto px-4 py-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
